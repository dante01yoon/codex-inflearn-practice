  <style>
    :root { color-scheme: light; --ink:#14213e; --muted:#5b6780; --green:#30643f; --line:#e5e9ef; }

    body { margin:0; background:#fff; color:var(--ink); font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }

    h2 { font-size:18px; margin:0 0 12px; }

    .toolbar { display:flex; justify-content:space-between; align-items:center; gap:16px; border-top:1px solid var(--line); margin:22px 0 20px; padding-top:14px; }

    .select-wrap { position:relative; }

    select { appearance:none; font:inherit; font-size:16px; color:var(--ink); background:white; border:1px solid #d2d9e3; border-radius:6px; min-width:195px; padding:13px 42px 13px 15px; cursor:pointer; }
    select:focus-visible { outline:3px solid #8bb89a; outline-offset:3px; }
    #books { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); column-gap:18px; row-gap:28px; }
    .book { min-width:0; }
    .cover { background:#f5f6f8; border-radius:7px; height:clamp(240px,25vw,350px); padding:16px; display:flex; justify-content:center; align-items:center; position:relative; }
    .cover img { display:block; max-width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 4px 7px #14213e20); transition:transform .2s; }
    .book:hover .cover img { transform:translateY(-4px); }
    .cover-fallback { font-size:14px; text-align:center; color:var(--muted); padding:20px; }
    h3 { font-size:18px; font-weight:600; line-height:1.4; margin:12px 0 5px; overflow-wrap:anywhere; }
    .rating { display:flex; gap:2px; margin:6px 0; }
    .rating svg { width:24px; height:24px; }
    .price { font-size:20px; font-weight:700; margin:6px 0 0; }
    .empty { padding:35px; text-align:center; color:var(--muted); }
    footer { border-top:1px solid var(--line); margin-top:38px; padding-top:18px; color:var(--muted); font-size:13px; line-height:1.6; }
    footer a { color:var(--green); text-underline-offset:3px; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media(min-width:1440px) { .cover { height:350px; } }
    @media(max-width:1000px) { main { padding:28px; } #books { grid-template-columns:repeat(3,minmax(0,1fr)); } .cover { height:320px; } }
    @media(max-width:620px) { main { padding:24px 18px 40px; } .subtitle { font-size:17px; } #books { grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px 14px; } .cover { height:230px; padding:12px; } .toolbar { align-items:stretch; flex-direction:column; } .controls { gap:10px; } .select-wrap { flex:1; min-width:0; } select { width:100%; min-width:0; font-size:14px; padding-left:10px; } h3 { font-size:15px; } #chart { height:180px; } .chart-panel { padding:16px 10px; } }
    @media(max-width:350px) { #books { grid-template-columns:1fr; } }
    @media(prefers-reduced-motion:reduce) { .cover img { transition:none; } }
  </style>
</head>

  <script>
    'use strict';
    const books = JSON.parse(document.getElementById('book-data').textContent).map(book => ({...book, price:Number(book.price_gbp), rating:Number(book.rating)}));
    const svgNS = 'http://www.w3.org/2000/svg';
    const money = new Intl.NumberFormat('en-GB', { style:'currency', currency:'GBP' });
    const sort = document.getElementById('sort');
    const rating = document.getElementById('rating');
    const grid = document.getElementById('books');
    const chart = document.getElementById('chart');
    document.getElementById('subtitle').textContent = `${books.length}권의 책, 새로운 발견`;

    function svgNode(tag, attrs, text) {
      const node = document.createElementNS(svgNS, tag);
      for (const [key,value] of Object.entries(attrs)) node.setAttribute(key,value);
      if (text !== undefined) node.textContent = text;
      return node;
    }
    function renderChart(filtered) {
      chart.replaceChildren();
      const width=Math.max(280,chart.clientWidth), height=200, left=35, right=10, top=22, bottom=35;
      chart.setAttribute('viewBox',`0 0 ${width} ${height}`);
      chart.setAttribute('preserveAspectRatio','none');
      chart.append(svgNode('title',{id:'chart-title'},'가격대별 책 수'));
      const start = books.length ? Math.floor(Math.min(...books.map(book=>book.price))/10)*10 : 10;
      const end = books.length ? Math.floor(Math.max(...books.map(book=>book.price))/10)*10+10 : 60;
      const bins=[];
      for(let lower=start;lower<end;lower+=10) bins.push({lower,count:filtered.filter(book=>book.price>=lower && book.price<lower+10).length});
      const summary=bins.map(bin=>`£${bin.lower} 이상 £${bin.lower+10} 미만: ${bin.count}권`).join(', ');
      chart.append(svgNode('desc',{id:'chart-description'},summary));
      document.getElementById('chart-summary').textContent=summary;
      const max=Math.max(5,Math.ceil(Math.max(...bins.map(bin=>bin.count),0)/5)*5);
      const plotHeight=height-top-bottom, slot=(width-left-right)/bins.length;
      for(let tick=0;tick<=max;tick+=5) {
        const y=height-bottom-(tick/max)*plotHeight;
        chart.append(svgNode('line',{x1:left,y1:y,x2:width-right,y2:y,stroke:'#e5e9ef'}));
        chart.append(svgNode('text',{x:left-10,y:y+4,'text-anchor':'end',fill:'#5b6780','font-size':12},tick));
      }
      bins.forEach((bin,index)=>{
        const barHeight=(bin.count/max)*plotHeight, x=left+slot*index+slot*.23, y=height-bottom-barHeight;
        const bar=svgNode('rect',{class:'bar',x,y,width:slot*.54,height:barHeight,rx:2,fill:'#30643f','data-count':bin.count});
        bar.append(svgNode('title',{},`£${bin.lower}–${bin.lower+10}: ${bin.count}권`));
        chart.append(bar);
        chart.append(svgNode('text',{x:left+slot*(index+.5),y:y-7,'text-anchor':'middle',fill:'#14213e','font-size':13,'font-weight':700},bin.count));
        chart.append(svgNode('text',{x:left+slot*(index+.5),y:height-10,'text-anchor':'middle',fill:'#5b6780','font-size':13},`£${bin.lower}–${bin.lower+10}`));
      });
    }
    function bookCard(book) {
      const card=document.createElement('article'); card.className='book'; card.dataset.price=book.price; card.dataset.rating=book.rating;
      const cover=document.createElement('div'); cover.className='cover';
      const image=document.createElement('img'); image.src=book.image_url; image.alt=`${book.title} 표지`; image.decoding='async'; image.referrerPolicy='no-referrer';
      image.addEventListener('error',()=>{const fallback=document.createElement('span'); fallback.className='cover-fallback'; fallback.textContent='표지를 불러올 수 없습니다'; image.replaceWith(fallback);},{once:true});
      cover.append(image);
      const title=document.createElement('h3'); title.textContent=book.title;
      const stars=document.createElement('div'); stars.className='rating'; stars.setAttribute('role','img'); stars.setAttribute('aria-label',`별점 ${book.rating}/5`);
      for(let i=1;i<=5;i++) { const star=svgNode('svg',{viewBox:'0 0 24 24','aria-hidden':'true'}); star.append(svgNode('path',{d:'m12 2.2 3.05 6.18 6.82.99-4.94 4.82 1.17 6.79L12 17.77l-6.1 3.21 1.16-6.79-4.93-4.82 6.82-.99Z',fill:i<=book.rating?'#ffbb2b':'#dedfe2'})); stars.append(star); }
      const price=document.createElement('p'); price.className='price'; price.textContent=money.format(book.price);
      card.append(cover,title,stars,price); return card;
    }
    function render() {
      const filtered=books.filter(book=>rating.value==='all' || book.rating===Number(rating.value));
      if(sort.value==='ascending') filtered.sort((a,b)=>a.price-b.price);
      if(sort.value==='descending') filtered.sort((a,b)=>b.price-a.price);
      grid.replaceChildren(...filtered.map(bookCard));
      document.getElementById('result-count').textContent=rating.value==='all'?`전체 ${filtered.length}권`:`별점 ${rating.value}점 · ${filtered.length}권`;
      document.getElementById('empty').hidden=filtered.length>0;
      renderChart(filtered);
    }
    sort.addEventListener('change',render); rating.addEventListener('change',render);
    window.addEventListener('resize',()=>renderChart(books.filter(book=>rating.value==='all' || book.rating===Number(rating.value))));
    render();
  </script>
</body>
</html>
